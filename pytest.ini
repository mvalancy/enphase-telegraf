[pytest]
testpaths = tests
pythonpath = src
markers =
    e2e: End-to-end tests that hit real Enphase cloud and InfluxDB services
# e2e talks to the real Enphase cloud and a real InfluxDB, so it must be
# opted into (`pytest -m e2e`) rather than run by accident.
addopts = -v --tb=short -m 'not e2e'
