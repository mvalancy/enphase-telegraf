# Fast lane: feature/* -> dev, and pushes to dev.
#
# pytest.ini now excludes the e2e marker by default, so a plain `pytest` run
# is safe here: the 20 e2e tests talk to a real Enphase gateway and a real
# InfluxDB and must be opted into. Everything else is offline and takes ~3s.
name: fast

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Tests
        run: python -m pytest -q

      - name: Shell scripts parse and lint
        run: |
          VER=v0.11.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/$VER/shellcheck-$VER.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin "shellcheck-$VER/shellcheck"
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "SYNTAX: $f"; fail=1; }
          done < <(find . -name '*.sh' -not -path './.git/*')
          exit "$fail"
